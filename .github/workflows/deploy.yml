name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # tai master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Jos käytät React/Vite-käännöstä, poista kommenttimerkit (#) seuraavista kahdesta kohdasta:
      # - name: Install and Build
      #   run: |
      #     cd frontend
      #     npm install
      #     npm run build

      - name: Setup Pages
        uses: actions/github-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Määritetään polku kansion kohdalle jossa index.html on
          # (Jos teet buildin, tämä on yleensä 'frontend/dist' tai 'frontend/build')
          path: 'frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4