name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # Varmista että tämä vastaa päähaarasi nimeä (main tai master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Asennetaan riippuvuudet ja käännetään koodi dist-kansioon
      - name: Install and Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 2. Osoitetaan GitHub Pages lukemaan nimenomaan käännettyä 'dist'-kansiota
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4