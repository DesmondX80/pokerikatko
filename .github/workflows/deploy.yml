name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"] # Varmista että tämä vastaa päähaarasi nimeä (main tai master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Poista kommenttimerkit (#) alta, jos koodisi pitää kääntää ennen julkaisua:
      # - name: Install and Build
      #   run: |
      #     cd frontend
      #     npm install
      #     npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Määritä tähän kansio, jossa index.html sijaitsee
          # (esim. 'frontend' tai 'frontend/dist' jos teet npm run buildin)
          path: 'frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4